# Prefix: Option-Space
unbind C-b
set -gu prefix2
set -g prefix M-Space
bind M-Space send-prefix

# Pane navigation and splitting
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-H select-pane -L
bind -n M-J select-pane -D
bind -n M-K select-pane -U
bind -n M-L select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane and window navigation
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10
bind -n M-n next-window
bind -n M-p previous-window
bind w choose-tree -Zsw -F "#[fg=#00ff88,bold]#S#[default] #{?window_index,#[fg=#ffffff]#I:#W,}"
bind S choose-tree -Zs -F "#[fg=#00ff88,bold]#S#[default]"

# General settings
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g display-panes-time 5000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g set-clipboard on
set -as terminal-features ",*:clipboard"
set -g extended-keys on
set -g extended-keys-format csi-u

# Vi copy mode. tmux's OSC 52 clipboard support is portable in the container.
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi / command-prompt -p "search down:" "send -X search-forward '%%'"
bind -T copy-mode-vi ? command-prompt -p "search up:" "send -X search-backward '%%'"
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi Escape send -X cancel

# Vercel-inspired status and pane styling
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#000000,fg=#666666"
set -g status-left "#{?client_prefix,#[fg=#000000 bg=#ffffff] PREFIX #[bg=#000000] ,#[fg=#ffffff] #S }#[fg=#333333]|"
set -g status-right "#{?client_prefix,#[fg=#333333]| #[fg=#ffffff]waiting... ,#[fg=#333333]| #[fg=#666666]%H:%M }"
set -g status-left-length 30
set -g status-right-length 20
set -g status-justify left
setw -g window-status-format "  #[fg=#555555]#I #[fg=#666666]#W "
setw -g window-status-current-format "  #[fg=#ffffff]#I #[fg=#ffffff,bold]#W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#111111"
set -g pane-active-border-style "fg=#333333"
set -g pane-border-lines single
set -g message-style "bg=#000000,fg=#ffffff"
set -g message-command-style "bg=#000000,fg=#ffffff"
set -g mode-style "bg=#222222,fg=#ffffff"
set -g display-panes-colour "#333333"
set -g display-panes-active-colour "#ffffff"

# Quality of life
bind r source-file ~/.tmux.conf \; display "Config reloaded"
bind x kill-pane
bind -n C-w kill-pane
